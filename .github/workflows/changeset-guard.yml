name: Changeset Guard

# WHY THIS EXISTS. The 0.7.0 wave (2026-08-31) was assembled with a changeset
# that named the PRIVATE family roots @rozie/target-{react,solid,angular,lit}
# alongside the public @rozie/core. Two things were wrong with it, and both are
# invisible until you actually try to cut a release:
#
#   1. Naming a private root versions NOTHING — .changeset/config.json sets
#      privatePackages.version:false, so those four entries were inert.
#   2. Worse, config.json also `ignore`s 54 held-back leaves, which made the
#      entry a MIXED changeset (ignored + non-ignored packages). That is a HARD
#      ERROR in @changesets/assemble-release-plan: `changeset status` AND
#      `changeset version` both abort outright. The whole pending wave was
#      unreleasable — 13 changesets, 131 packages — not just the bad entry.
#
# The defect sat on main through a full green CI sweep: all ten workflows
# (six framework matrices, repo-wide typecheck, visual regression, adoption
# smokes, docs) passed while the release pipeline was broken, because nothing
# in CI has ever exercised the release plan. It surfaced only when a human went
# to publish. `pnpm changeset:check` catches case (1) in about a second and
# `changeset status` catches case (2); neither was wired up.
#
# TWO CHECKS, NOT ONE — they cover different classes and neither subsumes the
# other:
#   - check-changeset-private-packages.mjs catches a PRIVATE root by name. It
#     does not know about the `ignore` list.
#   - `changeset status` computes the actual release plan, which is the only
#     thing that catches a mixed changeset. Note this fires even when every
#     named package is public: naming one of the 54 ignored-but-public
#     held-back leaves next to a non-ignored one is the same hard error.
#
# PATH FILTER RATIONALE. Unlike typecheck.yml (deliberately unfiltered, since a
# type regression can come from anywhere), this defect class has a bounded set
# of inputs: the changeset files themselves, the config that decides what is
# ignored, the guard script, and — following dep-drift.yml's WR-02 reasoning —
# any package.json, because a package flipping to `private: true` retroactively
# turns an existing, previously-valid changeset into a private-root entry.
#
# Cost: an install plus two node invocations. Seconds.
#
# QUICK 260904-6ix — TWO MORE BLOCKING STEPS, AND THE FILTER WIDENS.
# `pnpm release:ready` adds two registry-free gates on top of the two above:
# changeset coverage (check g — a publishable, non-ignored package's shipped
# files drifted since its own last version-bump commit with no pending
# changeset naming it) and the no-major preflight (a pending wave would land
# something outside 0.x). `release-precheck.mjs --self-test` proves neither
# check can go vacuous — a gate that silently stops working is worth nothing,
# so the proof runs as its own blocking step alongside the gate it proves.
#
# The path-filter widening to `packages/**` is REQUIRED, not cosmetic: check
# (g)'s input set is every shipped file in every publishable package, so the
# pre-6ix filter (`.changeset/**` + `**/package.json` + two named files) would
# miss the entire defect class it exists to catch — the `@rozie-ui/data-table-
# react` known-positive this check replays was a `src/DataTable.d.ts` edit
# that touched no `package.json` at all.
#
# `fetch-depth: 0` (below) is now LOAD-BEARING, not insurance: check (g)'s
# anchor derivation is `git log -L '/"version"/,+1:<pkg>/package.json' HEAD`,
# which walks the whole version-line history of every publishable package's
# `package.json`. A shallow clone silently returns an empty anchor for most
# packages, and the gate goes vacuous — this is exactly what the --self-test
# `<precondition>` (release-precheck.mjs's own runSelfTest, and the plan's
# Task 1) checks for locally; in CI, `fetch-depth: 0` is what prevents it.

on:
  push:
    branches: [main]
    paths:
      - '.changeset/**'
      - 'scripts/check-changeset-private-packages.mjs'
      - 'scripts/release-precheck.mjs'
      - 'scripts/release-ready.mjs'
      - 'scripts/check-readme-jsx-props.mjs'
      - '.github/workflows/changeset-guard.yml'
      - '**/package.json'
      - 'packages/**'
  pull_request:
    paths:
      - '.changeset/**'
      - 'scripts/check-changeset-private-packages.mjs'
      - 'scripts/release-precheck.mjs'
      - 'scripts/release-ready.mjs'
      - 'scripts/check-readme-jsx-props.mjs'
      - '.github/workflows/changeset-guard.yml'
      - '**/package.json'
      - 'packages/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changeset-guard:
    name: changeset release-plan integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # fetch-depth: 0 is insurance, not decoration. `changeset status` without
      # --since reads .changeset/*.md and needs no history, but the CLI also
      # resolves the current branch, and a shallow detached-HEAD checkout is a
      # known source of CI-only changesets failures. The clone is cheap here
      # because this job installs nothing else.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Class 1: a changeset naming a private family root. Versions nothing,
      # and combined with the ignore list produces the mixed-changeset abort.
      - name: Private-root guard
        run: node scripts/check-changeset-private-packages.mjs

      # Class 2: the release plan must actually assemble. This is the check
      # that would have caught the 0.7.0 breakage. An empty .changeset/ exits 0,
      # so this is a no-op between waves rather than a nuisance failure.
      - name: Release plan assembles (mixed-changeset guard)
        run: pnpm exec changeset status

      # Class 3 (quick 260904-6ix): the fast, registry-free release gate —
      # changeset coverage (g) + no-major preflight + the private-root guard
      # above + the README render-prop gate + release-precheck's structural
      # (b)(c)(d) checks. Same command a releaser runs locally as step 1 of
      # RELEASING.md §4. Blocking — no continue-on-error.
      - name: Release ready (fast gate)
        run: pnpm release:ready

      # Class 4 (quick 260904-6ix): proves check (g) and the no-major
      # preflight are not vacuous, against REAL repo history (the
      # @rozie-ui/data-table-react known-positive at commit 592096a75). A
      # gate that can silently stop catching its own defect class is worth
      # nothing — this runs as its own blocking step so vacuity fails loudly
      # rather than being masked by an unrelated green run.
      - name: Release-ready self-test (vacuity proof)
        run: node scripts/release-precheck.mjs --self-test
