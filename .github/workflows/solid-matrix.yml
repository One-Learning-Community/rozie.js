name: Solid 1.8 + 1.9 Matrix

# Per-target CI for the Solid compile target.
#
# The cross-framework matrix workflows previously covered only
# React/Vue/Svelte/Angular — the "core four". Solid and Lit shipped later as
# targets 5 and 6 and never got dedicated workflows, leaving their per-target
# unit suites and consumer demos CI-dark: only the Visual Regression matrix
# (which renders all six targets) exercised them at all.
#
# This workflow closes the Solid half of that gap. It mirrors
# svelte-matrix.yml: build the workspace, run the Solid target + runtime +
# unplugin unit suites, then build the solid-vite demo and run its Playwright
# e2e against both supported solid-js lines.
#
# Matrix: solid-js 1.8 (runtime-solid's declared peer-dep floor) + 1.9 (the
# line the demo and @rozie/target-solid pin). Single Vite — the demo pins
# vite ^6 and vite-plugin-solid 2.11 drives the JSX transform; a Vite-version
# axis is deferred (Solid breakage does not live there).
#
# `push: [main]` runs on every push (no path filter) so a `packages/core/**`
# emitter change always re-exercises Solid even when nothing under
# packages/targets/solid changed — the drift the matrix is here to catch.

on:
  pull_request:
    paths:
      - 'packages/targets/solid/**'
      - 'packages/runtime/solid/**'
      - 'packages/unplugin/**'
      - 'packages/core/**'
      - 'examples/consumers/solid-vite/**'
      - '.github/workflows/solid-matrix.yml'
  push:
    branches: [main]

jobs:
  # ---------------------------------------------------------------------------
  # Shared build producer (quick 260825-hp3). Every job below used to run its
  # own bare `pnpm turbo run build` — measured at ~11 min on push f699edef and
  # ~86% of this workflow's CI minutes, paid 2× over. This job builds the
  # workspace ONCE and publishes `.turbo`; the jobs below restore it, so their
  # own `turbo run build` replays from cache instead of rebuilding.
  #
  # It also runs the framework-agnostic unit suites (quick 260825-n4y), so it
  # DOES assert — but it still is not a gate. Every consumer below is
  # `if: ${{ !cancelled() }}`, so a RED producer never skips them: they run,
  # fall back to a real full build, and report their own result. That is what
  # preserves the 260819-mqx decision recorded in vue-matrix.yml — the invariant
  # is the !cancelled() guard, NOT the producer being assertion-free. A `needs:`
  # chain must never hide a downstream failure behind a skip.
  build:
    name: Build workspace (shared turbo cache producer)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Seed from the most recent prior build so unchanged packages hit turbo's
      # content-addressed cache. A `packages/core` change still invalidates the
      # whole downstream graph and rebuilds it — that is intended.
      - name: Restore turbo cache
        uses: actions/cache/restore@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-solid-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-solid-
            ${{ runner.os }}-turbo-

      # Quick 260829-t8t: narrowed from a bare `pnpm turbo run build` (520
      # tasks) to the consumer-demo closure (61 tasks, -88%) — the
      # `@rozie-ui/<family>-<target>` leaves (~240 tasks) are built by no step
      # in this workflow. `{./examples/consumers/*}...` is a glob over every
      # consumer demo plus its dependency closure, so a new demo is picked up
      # automatically rather than rotting out of a hardcoded list. This still
      # pulls in all six `@rozie/target-*` packages (via `@rozie/unplugin`'s
      # devDeps), which the swipe canary's emit tests and the dts-identity
      # test below need to see every target's `dist/`.
      #
      # The demo set is NOT trimmable to `solid-vite-demo` alone: the
      # `solid-matrix` job's WR-03 step (`check-sidecar-staleness.mjs
      # --require-complete`) walks ALL of `examples/consumers/`, not just the
      # Solid demo, and hard-fails on any `.rozie` with no sidecar next to it.
      # `angular-analogjs-demo` is the one exclusion, mirroring that gate's own
      # `skipDirs: ['angular-analogjs']` — its sidecars are never required, and
      # it is the single expensive (ngtsc AOT) build in the set.
      #
      # Both `turbo run build` invocations in this file (here and in
      # `solid-matrix` below) MUST carry the identical filter: this job is
      # the turbo-cache producer the cell restores from (quick 260825-hp3), so
      # a narrower producer set would force the cell to rebuild the difference
      # and break the producer/consumer contract.
      - name: Build all packages
        run: pnpm turbo run build --filter='{./examples/consumers/*}...' --filter='!angular-analogjs-demo'

      # Hoisted out of the matrix cells (quick 260825-n4y). These two suites are
      # framework-agnostic — nothing in either varies with this workflow's matrix
      # axis — so they were running once PER CELL for no signal. Across CI that
      # was 13 `packages/core` runs per push at ~126s each; hoisting takes it to
      # 6 (~15 min/push). The cells keep their own target/runtime suites, which
      # are the actual matrix signal.
      #
      # Safe to assert here: a failure turns the producer red but hides nothing,
      # because every consumer is `if: ${{ !cancelled() }}` and still runs. The
      # 260819-mqx invariant is the !cancelled() guard, not the producer being
      # assertion-free.
      - name: Run framework-agnostic unit tests (core + unplugin)
        run: |
          pnpm exec vitest run --root packages/core
          pnpm exec vitest run --root packages/unplugin

      # ONLY the producer saves. Consumers are restore-only, which is what fixes
      # the `Unable to reserve cache ... another job may be creating this cache`
      # that 4 of the 5 React jobs hit when every cell wrote the same key.
      - name: Save turbo cache
        uses: actions/cache/save@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-solid-${{ github.sha }}

  solid-matrix:
    runs-on: ubuntu-latest
    needs: build
    # 260825-hp3: `needs: build` is for ORDERING only. `!cancelled()` keeps
    # this job running even when the producer is red, so it falls back to a
    # real full build instead of being skipped and masking a failure.
    if: ${{ !cancelled() }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        solid-version: ['1.8', '1.9']
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Restore-only (quick 260825-hp3). The `build` job above already produced
      # this exact key for this SHA, so `turbo run build` below replays from
      # cache instead of rebuilding the workspace. This job deliberately does
      # NOT save: every cell writing one key is what produced the observed
      # `Unable to reserve cache ... another job may be creating this cache`.
      # If the restore misses (producer red, cache evicted), the build step
      # below still does a real full build — degraded, never wrong.
      - name: Restore turbo cache (produced by the `build` job)
        uses: actions/cache/restore@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-solid-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-solid-
            ${{ runner.os }}-turbo-

      # Build the workspace via turbo. The swipe canary's emit tests import
      # every target's dist/ and the dts-identity test reads every target's
      # dist/index.d.mts — so all 6 targets must be built even on a Solid-only
      # CI run. That still holds under the narrowed filter below, because
      # `@rozie/unplugin` devDepends on all six `@rozie/target-*` packages.
      #
      # Phase 22 / REQ-6: `turbo run build` includes `solid-vite-demo#build`
      # (`vite build`), whose @rozie/unplugin `buildStart` hook emits the
      # per-module `<Name>.d.rozie.ts` sidecars. Sidecars are gitignored (REQ-7),
      # absent on a fresh checkout — this step generates them BEFORE the
      # "Typecheck demo" step, closing the cold-checkout race.
      #
      # Quick 260829-t8t: filtered identically to the `build` job's producer
      # step above (520 -> 61 tasks, -88%; the ~240 unread `@rozie-ui/*-target`
      # leaves are dropped). The filter must cover every consumer demo, not
      # just `solid-vite-demo`: the WR-03 step two steps below
      # (`check-sidecar-staleness.mjs --require-complete`) walks ALL of
      # `examples/consumers/` and hard-fails on any `.rozie` with no sidecar
      # beside it. `angular-analogjs-demo` is excluded because that gate's own
      # walk already skips `angular-analogjs`. This invocation must stay
      # identical to the `build` job's, which is the turbo-cache producer this
      # one restores from.
      - name: Build all packages (generates .d.rozie.ts sidecars before typecheck — REQ-6)
        run: pnpm turbo run build --filter='{./examples/consumers/*}...' --filter='!angular-analogjs-demo'

      - name: Run unit tests (target-solid + runtime-solid)
        run: |
          pnpm exec vitest run --root packages/targets/solid
          pnpm exec vitest run --root packages/runtime/solid

      - name: Override Solid version for the demo
        working-directory: examples/consumers/solid-vite
        run: pnpm add solid-js@~${{ matrix.solid-version }}

      - name: Re-install with version override
        run: pnpm install --no-frozen-lockfile

      # WR-03: a `.rozie` with no sidecar after the build means buildStart
      # silently failed to emit it; --require-complete makes that a hard failure.
      - name: Verify every demo .rozie has a fresh sidecar (WR-03)
        run: node scripts/check-sidecar-staleness.mjs --require-complete

      # REQ-6: the .d.rozie.ts sidecars this consumes were generated by the
      # "Build all packages" step above (buildStart hook) — never reorder before it.
      - name: Typecheck demo (sidecars generated above — REQ-6)
        run: pnpm --filter solid-vite-demo run typecheck

      - name: Build demo
        run: pnpm --filter solid-vite-demo run build

      - name: Install Playwright Chromium
        run: pnpm --filter solid-vite-demo run test:e2e:install

      - name: Run Playwright e2e tests
        run: pnpm --filter solid-vite-demo run test:e2e

      - name: Upload Playwright HTML report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-solid-${{ matrix.solid-version }}
          path: examples/consumers/solid-vite/playwright-report
          retention-days: 7
