name: Vue 3.4 + 3.5 Matrix

# Phase 3 Plan 06 / D-27: verify the emitted .vue output works against both
# the Vue 3.4 floor (the version that introduced `defineModel` — PROJECT.md
# constraint) AND the latest Vue 3.5.x.
#
# STRUCTURE (quick 260819-mqx). This workflow used to be ONE job that ran the
# cross-target gates and then both Vue legs sequentially. That made it the
# longest-running matrix workflow while carrying the SHORTEST timeout, and on
# 2026-08-19 it silently ate itself three times: killed at 20m20s / 20m22s /
# 20m24s against `timeout-minutes: 20`, always mid "Install Playwright
# Chromium", so BOTH legs were skipped every time. A timed-out job reports as
# `cancelled`, so it read as an infra blip and went undiagnosed while Vue sat
# unverified against the whole Phase 80 backlog (quick 260819-i06).
#
# It is now two jobs, matching every other matrix workflow in this repo:
#   vue-gates  — the cross-target gates, once
#   vue-matrix — a REAL matrix over the Vue versions, legs in parallel
#
# NEITHER job gates the other. Gating is exactly the shape that hid a real bug
# on 2026-08-19: the `integration-build` job in angular-matrix.yml is
# `needs: [angular-matrix]`, angular-matrix was red, so a genuine `vite build`
# failure sat masked behind a SKIP for the entire backlog and only surfaced
# once the upstream job was fixed. Both jobs must surface their own failure in
# the same run.
#
# AMENDED quick 260825-hp3. Both jobs now carry `needs: build`, but that is an
# ORDERING edge, not a gate, and it does not reopen the hazard above:
#   - both jobs are `if: ${{ !cancelled() }}`, so a RED producer does not skip
#     them — they run, fall back to a real full build, and report their own
#     result. This is the load-bearing part;
#   - each keeps its own `turbo run build` step as that fallback.
# Since 260825-n4y the producer also runs the framework-agnostic unit suites, so
# it DOES assert now. That is safe for the same reason: nothing it reports can be
# hidden, because no consumer is ever skipped on its failure.
# The failure mode degrades to the pre-260825-hp3 behaviour. It never degrades
# to a skip. The rule stands: a `needs:` chain must never hide a failure.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ---------------------------------------------------------------------------
  # Shared build producer (quick 260825-hp3). Every job below used to run its
  # own bare `pnpm turbo run build` — measured at ~11 min on push f699edef and
  # ~86% of this workflow's CI minutes, paid 3× over. This job builds the
  # workspace ONCE and publishes `.turbo`; the jobs below restore it, so their
  # own `turbo run build` replays from cache instead of rebuilding.
  #
  # It also runs the framework-agnostic unit suites (quick 260825-n4y), so it
  # DOES assert — but it still is not a gate. Every consumer below is
  # `if: ${{ !cancelled() }}`, so a RED producer never skips them: they run,
  # fall back to a real full build, and report their own result. That is what
  # preserves the 260819-mqx decision recorded in vue-matrix.yml — the invariant
  # is the !cancelled() guard, NOT the producer being assertion-free. A `needs:`
  # chain must never hide a downstream failure behind a skip.
  build:
    name: Build workspace (shared turbo cache producer)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Seed from the most recent prior build so unchanged packages hit turbo's
      # content-addressed cache. A `packages/core` change still invalidates the
      # whole downstream graph and rebuilds it — that is intended.
      - name: Restore turbo cache
        uses: actions/cache/restore@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-vue-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-vue-
            ${{ runner.os }}-turbo-

      # Quick 260829-t8t: narrowed from a bare `pnpm turbo run build` (520
      # tasks) to the consumer-demo closure plus this workflow's cross-target
      # gates (107 tasks, -79%). `{./examples/consumers/*}...` is a glob over
      # every consumer demo plus its dependency closure, so a new demo is
      # picked up automatically rather than rotting out of a hardcoded list.
      # This still pulls in all six `@rozie/target-*` packages (via
      # `@rozie/unplugin`'s devDeps), which the swipe canary's emit tests and
      # the dts-identity test need to see every target's `dist/`.
      #
      # `vue-gates` runs three gate suites the demo closure alone does not
      # reach: `@rozie/strict-conformance`, `@rozie/event-contract-conformance`
      # and the Vue-leaf gate. The load-bearing one is `@rozie/vue-typecheck`,
      # which depends on `@rozie-ui/data-table-vue`, `@rozie-ui/listbox-vue`
      # and `@rozie-ui/sortable-list-vue` — three `@rozie-ui` leaves that are
      # NOT in the consumer-demo closure. `@rozie/runtime-lit`
      # (`strict-conformance`'s dep) is likewise pulled in via its own filter
      # term. Dropping the `@rozie-ui` leaves wholesale is correct in the
      # other five matrix workflows and WRONG here.
      #
      # `@rozie/strict-conformance` alone reaches a further 12 `@rozie-ui`
      # family leaves (`@rozie-ui/{combobox,slider,listbox,data-table}-
      # {react,solid,lit}`) — not through the workflow's `--filter`, but
      # because quick 260829-t8t (validation phase) declared them as
      # `workspace:*` devDependencies of `tests/strict-conformance` after this
      # filter's first `act` run went RED: the leaf-body typecheck suite reads
      # those 12 packages' src/ off disk with no package-dependency edge, so
      # turbo's graph could not see them, they went unbuilt under the
      # narrowed filter, and TS2307 pushed the recorded strict-tsc baseline
      # into REGRESSION. The dependency was always real — the suite always
      # needed those 12 leaves built — it was simply undeclared, which is
      # exactly why no graph-derived filter could have seen it. 75 -> 107
      # tasks reflects `@rozie/strict-conformance...` now correctly
      # traversing that edge; the filter LINE itself needed no change.
      #
      # The demo set is NOT trimmable to `vue-vite-demo` alone: the
      # `vue-gates` job's WR-03 step (`check-sidecar-staleness.mjs
      # --require-complete`) walks ALL of `examples/consumers/`, not just the
      # Vue demo, and hard-fails on any `.rozie` with no sidecar next to it.
      # `angular-analogjs-demo` is the one exclusion, mirroring that gate's own
      # `skipDirs: ['angular-analogjs']` — its sidecars are never required, and
      # it is the single expensive (ngtsc AOT) build in the set.
      #
      # All three `turbo run build` invocations in this file (here, in
      # `vue-gates` below, and in `vue-matrix`) MUST carry the identical
      # filter: this job is the turbo-cache producer both cells restore from
      # (quick 260825-hp3), so a narrower producer set would force them to
      # rebuild the difference and break the producer/consumer contract.
      # `vue-matrix`'s own cell does not run the sidecar gate or the three
      # gate suites (those live in `vue-gates`) but still carries the
      # identical filter for that cache-contract reason.
      - name: Build all packages
        run: pnpm turbo run build --filter='{./examples/consumers/*}...' --filter='!angular-analogjs-demo' --filter='@rozie/vue-typecheck...' --filter='@rozie/strict-conformance...' --filter='@rozie/event-contract-conformance...'

      # Hoisted out of the matrix cells (quick 260825-n4y). These two suites are
      # framework-agnostic — nothing in either varies with this workflow's matrix
      # axis — so they were running once PER CELL for no signal. Across CI that
      # was 13 `packages/core` runs per push at ~126s each; hoisting takes it to
      # 6 (~15 min/push). The cells keep their own target/runtime suites, which
      # are the actual matrix signal.
      #
      # Safe to assert here: a failure turns the producer red but hides nothing,
      # because every consumer is `if: ${{ !cancelled() }}` and still runs. The
      # 260819-mqx invariant is the !cancelled() guard, not the producer being
      # assertion-free.
      - name: Run framework-agnostic unit tests (core + unplugin)
        run: |
          pnpm exec vitest run --root packages/core
          pnpm exec vitest run --root packages/unplugin

      # ONLY the producer saves. Consumers are restore-only, which is what fixes
      # the `Unable to reserve cache ... another job may be creating this cache`
      # that 4 of the 5 React jobs hit when every cell wrote the same key.
      - name: Save turbo cache
        uses: actions/cache/save@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-vue-${{ github.sha }}

  # ---------------------------------------------------------------------------
  # Cross-target gates. These live in THIS workflow (rather than a per-target
  # matrix) because its trigger has NO path filter — it runs on every PR to
  # main regardless of which files changed, which is the property each of these
  # gates needs. Runs once; not per Vue version, since none of them depend on
  # the demo's Vue version.
  # ---------------------------------------------------------------------------
  vue-gates:
    name: Cross-target gates (no path filter — runs on every PR)
    runs-on: ubuntu-latest
    needs: build
    # 260825-hp3: `needs: build` is for ORDERING only. `!cancelled()` keeps
    # this job running even when the producer is red, so it falls back to a
    # real full build instead of being skipped and masking a failure.
    if: ${{ !cancelled() }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Restore-only (quick 260825-hp3). The `build` job above already produced
      # this exact key for this SHA, so `turbo run build` below replays from
      # cache instead of rebuilding the workspace. This job deliberately does
      # NOT save: every cell writing one key is what produced the observed
      # `Unable to reserve cache ... another job may be creating this cache`.
      # If the restore misses (producer red, cache evicted), the build step
      # below still does a real full build — degraded, never wrong.
      - name: Restore turbo cache (produced by the `build` job)
        uses: actions/cache/restore@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-vue-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-vue-
            ${{ runner.os }}-turbo-

      # Build the workspace via turbo. The swipe canary's emit tests
      # (Plan 07.1-03) import every target's dist/, and the dts-identity test
      # reads every target's dist/index.d.mts — so all 6 targets must be built
      # even on Vue-only CI runs. That still holds under the narrowed filter
      # below, because `@rozie/unplugin` devDepends on all six
      # `@rozie/target-*` packages.
      #
      # Phase 22 / REQ-6: `turbo run build` includes `vue-vite-demo#build`
      # (`vite build`), whose @rozie/unplugin `buildStart` hook emits the
      # per-module `<Name>.d.rozie.ts` sidecars. Sidecars are gitignored (REQ-7),
      # absent on a fresh checkout — so this step must precede the WR-03 check
      # below (and the per-version typecheck in the vue-matrix job, which does
      # its own build for the same reason).
      #
      # Quick 260829-t8t: filtered identically to the `build` job's producer
      # step above (520 -> 107 tasks, -79%). The three gate-package filter
      # terms are required here because the gate steps below run all three
      # directly; the Vue-leaf gate's package is the one that pulls in
      # `@rozie-ui/data-table-vue`, `@rozie-ui/listbox-vue` and
      # `@rozie-ui/sortable-list-vue` — dropping the
      # `@rozie-ui` leaves wholesale (correct in every other matrix workflow)
      # would be WRONG in this one. The demo filter must cover every consumer
      # demo, not just `vue-vite-demo`: the WR-03 step further down
      # (`check-sidecar-staleness.mjs --require-complete`) walks ALL of
      # `examples/consumers/` and hard-fails on any `.rozie` with no sidecar
      # beside it. `angular-analogjs-demo` is excluded because that gate's own
      # walk already skips `angular-analogjs`. This invocation must stay
      # identical to the `build` job's, which is the turbo-cache producer this
      # one restores from.
      - name: Build all packages (generates .d.rozie.ts sidecars — REQ-6)
        run: pnpm turbo run build --filter='{./examples/consumers/*}...' --filter='!angular-analogjs-demo' --filter='@rozie/vue-typecheck...' --filter='@rozie/strict-conformance...' --filter='@rozie/event-contract-conformance...'

      # Quick task 260711-v2l: cross-target strict-tsc leaf baseline. Placed
      # AFTER the build above (every leaf's dist + node_modules must exist — the
      # harness copies each leaf's committed src/ into a tmpdir with symlinked
      # LEAF node_modules and a pinned tsc). Catches React/Solid/Lit family
      # regressions regardless of which files changed.
      - name: Strict-conformance gate — cross-target strict-tsc leaf baseline
        run: pnpm --filter @rozie/strict-conformance test

      # quick task 260811-sdd. An event-name asymmetry between a child's
      # dispatch name and a consumer's listener name is BY DEFINITION a
      # cross-target concern (any of the six targets can drift independently).
      # Placed AFTER `pnpm turbo run build` because the suite compiles fixtures
      # through the BUILT `@rozie/core` dist, matching
      # composed-ref-conformance/slot-matrix precedent. The gate is compile-only
      # (regex extraction over compiler output — no tsc/vue-tsc/svelte-check
      # subprocess), seconds not minutes, which is exactly why it can afford to
      # run on every PR (unlike composed-ref-conformance's real-checker legs —
      # see .planning/todos/pending/composed-ref-conformance-not-ci-wired.md for
      # why THAT suite stays off every-PR CI). Red here is REAL: a failing leg
      # means a consumer's listener is silently dead on that target — the exact
      # class of both 82918527 (Lit) and 9d651e12 (Angular). The suite also runs
      # under `turbo run test` (root `pnpm test` and `scripts/ci-prepush.sh`) by
      # virtue of being a workspace package; this step is the CI guarantee, the
      # turbo path is the local one.
      - name: Event-name contract gate — cross-target $emit ↔ listener-name agreement
        run: pnpm --filter @rozie/event-contract-conformance test

      # quick task 260623-jwh + 260629-ksp: the @rozie-ui Vue-leaf gate. Runs
      # AFTER the `pnpm turbo run build` above so every Vue leaf's compiled dist
      # (+ dist .d.ts) AND each leaf's node_modules exist before the gates run.
      # Layer 1 (structural guard) asserts no Vue leaf is source-only; Layer 2
      # (strict consumer surface) typechecks a STRICT typed consumer of the
      # compiled data-table dist with vue-tsc; Layer 3 (family-children,
      # 260629-ksp) strict-vue-tsc's the family CHILD SFC *bodies* (the committed
      # src/*.vue) against a recorded baseline so a NEW SFC-body type regression
      # flips RED. `vitest run` auto-collects every *.test.ts here, so the
      # family-children gate needs no dedicated step. A future source-only,
      # consumer-type-broken, or SFC-body-regressed Vue leaf fails this step.
      - name: Vue-leaf gate — structural + strict consumer-surface + SFC-body typecheck
        run: pnpm --filter @rozie/vue-typecheck test

      # WR-03: after the build has generated every in-root sidecar, a `.rozie`
      # with NO sidecar means buildStart silently failed to emit it (the
      # consumer's tsc would fall back to the wildcard and type-lie). With
      # --require-complete that becomes a hard CI failure.
      - name: Verify every demo .rozie has a fresh sidecar (WR-03)
        run: node scripts/check-sidecar-staleness.mjs --require-complete

      - name: Run unit tests (target-vue + runtime-vue)
        run: |
          pnpm exec vitest run --root packages/targets/vue
          pnpm exec vitest run --root packages/runtime/vue

  # ---------------------------------------------------------------------------
  # The actual version matrix. One job per Vue version, in parallel.
  # ---------------------------------------------------------------------------
  vue-matrix:
    name: Vue ${{ matrix.vue-version }} — typecheck + build + e2e
    runs-on: ubuntu-latest
    needs: build
    # 260825-hp3: `needs: build` is for ORDERING only. `!cancelled()` keeps
    # this job running even when the producer is red, so it falls back to a
    # real full build instead of being skipped and masking a failure.
    if: ${{ !cancelled() }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # 3.4 is the PROJECT.md floor (introduced `defineModel`); 3.5 is latest.
        vue-version: ['3.4', '3.5']
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Restore-only (quick 260825-hp3). The `build` job above already produced
      # this exact key for this SHA, so `turbo run build` below replays from
      # cache instead of rebuilding the workspace. This job deliberately does
      # NOT save: every cell writing one key is what produced the observed
      # `Unable to reserve cache ... another job may be creating this cache`.
      # If the restore misses (producer red, cache evicted), the build step
      # below still does a real full build — degraded, never wrong.
      - name: Restore turbo cache (produced by the `build` job)
        uses: actions/cache/restore@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-vue-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-vue-
            ${{ runner.os }}-turbo-

      # REQ-6 again: this job needs the `.d.rozie.ts` sidecars too, and jobs do
      # not share a filesystem — so each leg builds for itself. The turbo cache
      # above is what keeps that from being a full rebuild every time. Same
      # shape as the angular-matrix legs.
      #
      # Quick 260829-t8t: carries the SAME filter as the `build` job's producer
      # step and `vue-gates` above (520 -> 107 tasks) — including the three gate
      # closures, even though this cell does not itself run the sidecar gate or
      # `@rozie/vue-typecheck`/`strict-conformance`/`event-contract-conformance`
      # (those live in `vue-gates`). This job is a cache CONSUMER of the
      # `build` job (quick 260825-hp3); if its own filter's task set were a
      # strict subset, this step would rebuild the difference instead of
      # replaying from cache.
      - name: Build all packages (generates .d.rozie.ts sidecars before typecheck — REQ-6)
        run: pnpm turbo run build --filter='{./examples/consumers/*}...' --filter='!angular-analogjs-demo' --filter='@rozie/vue-typecheck...' --filter='@rozie/strict-conformance...' --filter='@rozie/event-contract-conformance...'

      - name: Install Playwright Chromium
        run: pnpm --filter vue-vite-demo exec playwright install --with-deps chromium

      - name: Pin Vue ${{ matrix.vue-version }}
        run: |
          pnpm --filter vue-vite-demo add vue@~${{ matrix.vue-version }}.0 --save-exact
          pnpm install --no-frozen-lockfile

      - name: Typecheck demo
        run: pnpm --filter vue-vite-demo run typecheck

      - name: Build demo
        run: pnpm --filter vue-vite-demo run build

      - name: Run Playwright e2e tests
        run: pnpm --filter vue-vite-demo exec playwright test

      # Artifact names must be unique per leg — upload-artifact@v7 errors on a
      # duplicate name rather than merging, so a bare `playwright-report` would
      # fail whichever leg uploaded second.
      - name: Upload Playwright HTML report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-vue-${{ matrix.vue-version }}
          path: examples/consumers/vue-vite/playwright-report
          retention-days: 7
