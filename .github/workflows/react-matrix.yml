name: React 18.2 + 19.x Matrix

# Phase 4 Plan 06 / D-60: verify the emitted .tsx output works against both
# the React 18.2 floor (PROJECT.md constraint — useSyncExternalStore land) AND
# the latest React 19. Plus per D-59: exercise both @vitejs/plugin-react and
# @vitejs/plugin-react-swc since the source-map composition path differs.
#
# Critical CI step: the workspace `lint:fixtures` script runs
# react-hooks/exhaustive-deps over packages/targets/react/fixtures/*.tsx with
# --max-warnings 0. This is the REACT-T-05 + D-62 anchor — every PR has to
# stay clean. NO eslint-disable allowed in any compiler-emitted .tsx.

on:
  pull_request:
    paths:
      - 'packages/targets/react/**'
      - 'packages/runtime/react/**'
      - 'packages/unplugin/**'
      - 'packages/core/**'
      - 'examples/consumers/react-vite/**'
      - 'tests/plugins/swipe/**'
      - '.github/workflows/react-matrix.yml'
  push:
    branches: [main]

jobs:
  # ---------------------------------------------------------------------------
  # Shared build producer (quick 260825-hp3). Every job below used to run its
  # own bare `pnpm turbo run build` — measured at ~11 min on push f699edef and
  # ~86% of this workflow's CI minutes, paid 5× over. This job builds the
  # workspace ONCE and publishes `.turbo`; the jobs below restore it, so their
  # own `turbo run build` replays from cache instead of rebuilding.
  #
  # It also runs the framework-agnostic unit suites (quick 260825-n4y), so it
  # DOES assert — but it still is not a gate. Every consumer below is
  # `if: ${{ !cancelled() }}`, so a RED producer never skips them: they run,
  # fall back to a real full build, and report their own result. That is what
  # preserves the 260819-mqx decision recorded in vue-matrix.yml — the invariant
  # is the !cancelled() guard, NOT the producer being assertion-free. A `needs:`
  # chain must never hide a downstream failure behind a skip.
  build:
    name: Build workspace (shared turbo cache producer)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Seed from the most recent prior build so unchanged packages hit turbo's
      # content-addressed cache. A `packages/core` change still invalidates the
      # whole downstream graph and rebuilds it — that is intended, and nothing
      # here introduces a `--filter` assumption about target independence.
      - name: Restore turbo cache
        uses: actions/cache/restore@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-react-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-react-
            ${{ runner.os }}-turbo-

      - name: Build all packages
        run: pnpm turbo run build

      # Hoisted out of the matrix cells (quick 260825-n4y). These two suites are
      # framework-agnostic — nothing in either varies with this workflow's matrix
      # axis — so they were running once PER CELL for no signal. Across CI that
      # was 13 `packages/core` runs per push at ~126s each; hoisting takes it to
      # 6 (~15 min/push). The cells keep their own target/runtime suites, which
      # are the actual matrix signal.
      #
      # Safe to assert here: a failure turns the producer red but hides nothing,
      # because every consumer is `if: ${{ !cancelled() }}` and still runs. The
      # 260819-mqx invariant is the !cancelled() guard, not the producer being
      # assertion-free.
      - name: Run framework-agnostic unit tests (core + unplugin)
        run: |
          pnpm exec vitest run --root packages/core
          pnpm exec vitest run --root packages/unplugin

      # ONLY the producer saves. Consumers are restore-only, which is what fixes
      # the `Unable to reserve cache ... another job may be creating this cache`
      # that 4 of the 5 React jobs hit when every cell wrote the same key.
      - name: Save turbo cache
        uses: actions/cache/save@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-react-${{ github.sha }}

  react-matrix:
    runs-on: ubuntu-latest
    needs: build
    # 260825-hp3: `needs: build` is for ORDERING only. `!cancelled()` keeps
    # this job running even when the producer is red, so it falls back to a
    # real full build instead of being skipped and masking a failure.
    if: ${{ !cancelled() }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        react-version: ['18.2', '19']
        plugin: ['plugin-react', 'plugin-react-swc']
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Restore-only (quick 260825-hp3). The `build` job above already produced
      # this exact key for this SHA, so `turbo run build` below replays from
      # cache instead of rebuilding the workspace. This job deliberately does
      # NOT save: every cell writing one key is what produced the observed
      # `Unable to reserve cache ... another job may be creating this cache`.
      # If the restore misses (producer red, cache evicted), the build step
      # below still does a real full build — degraded, never wrong.
      - name: Restore turbo cache (produced by the `build` job)
        uses: actions/cache/restore@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-react-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-react-
            ${{ runner.os }}-turbo-

      # Build the whole workspace via turbo. The swipe canary's emit tests
      # (Plan 07.1-03) import @rozie/target-{angular,svelte,solid,lit} and the
      # dts-identity test reads every target's dist/index.d.mts, so all 6
      # targets must be built before the unit-test step runs.
      #
      # Phase 22 / REQ-6 (sidecar generation BEFORE typecheck): `turbo run build`
      # includes `react-vite-demo#build` (`vite build`), whose @rozie/unplugin
      # `buildStart` hook emits the per-module `<Name>.d.rozie.ts` sidecars next
      # to the demo's `.rozie` sources. Sidecars are gitignored (REQ-7), so on a
      # fresh checkout they are absent — this step GENERATES them, and it runs
      # BEFORE the "Typecheck demo" step below, closing the cold-checkout race
      # (tsc must never resolve a `.rozie` import before its sidecar exists).
      - name: Build all packages (generates .d.rozie.ts sidecars before typecheck — REQ-6)
        run: pnpm turbo run build

      - name: Run unit tests (targets + runtime + swipe MOD-05 dogfood)
        run: |
          pnpm exec vitest run --root packages/targets/vue
          pnpm exec vitest run --root packages/targets/react
          pnpm exec vitest run --root packages/runtime/vue
          pnpm exec vitest run --root packages/runtime/react
          pnpm exec vitest run --root tests/plugins/swipe

      # REACT-T-05 + D-62 anchor: NO compiler-emitted eslint-disable; every
      # fixture .tsx must pass exhaustive-deps cleanly with --max-warnings 0.
      - name: Run exhaustive-deps lint over emitted fixtures (REACT-T-05 + D-62)
        run: pnpm --filter @rozie/target-react run lint:fixtures

      - name: Override React version for the demo
        working-directory: examples/consumers/react-vite
        run: |
          pnpm add react@^${{ matrix.react-version }} react-dom@^${{ matrix.react-version }}
          pnpm add -D @types/react@^${{ matrix.react-version }} @types/react-dom@^${{ matrix.react-version }}

      - name: Re-install with React-version overrides
        run: pnpm install --no-frozen-lockfile

      # WR-03: after the build has generated every in-root sidecar, a `.rozie`
      # with NO sidecar means buildStart silently failed to emit it (the
      # consumer's tsc would fall back to the wildcard and type-lie). With
      # --require-complete that becomes a hard CI failure (the no-flag default
      # keeps it a soft note for the dev / pre-push path).
      - name: Verify every demo .rozie has a fresh sidecar (WR-03)
        run: node scripts/check-sidecar-staleness.mjs --require-complete

      # REQ-6: the .d.rozie.ts sidecars this consumes were already generated by
      # the "Build all packages" step above (buildStart hook) — never run this
      # before that build, or tsc resolves `.rozie` imports with no declaration.
      - name: Typecheck demo (sidecars generated above — REQ-6)
        run: pnpm --filter react-vite-demo run typecheck

      # D-59: the SWC matrix leg uses vite.config.swc.ts (committed sibling
      # of vite.config.ts) so the SWC source-map composition path is exercised
      # without `sed`-rewriting the canonical vite.config.ts. Playwright is
      # invoked with VITE_USE_SWC=1 so its webServer.command picks `build:swc`.
      - name: Build demo (plugin-react)
        if: matrix.plugin == 'plugin-react'
        run: pnpm --filter react-vite-demo run build

      - name: Build demo (plugin-react-swc)
        if: matrix.plugin == 'plugin-react-swc'
        run: pnpm --filter react-vite-demo run build:swc

      - name: Install Playwright Chromium
        run: pnpm --filter react-vite-demo run test:e2e:install

      - name: Run Playwright e2e tests (plugin-react)
        if: matrix.plugin == 'plugin-react'
        run: pnpm --filter react-vite-demo run test:e2e

      - name: Run Playwright e2e tests (plugin-react-swc)
        if: matrix.plugin == 'plugin-react-swc'
        run: pnpm --filter react-vite-demo run test:e2e:swc

      - name: Upload Playwright HTML report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-react-${{ matrix.react-version }}-${{ matrix.plugin }}
          path: examples/consumers/react-vite/playwright-report
          retention-days: 7

  # quick/260601-wtb: Preact-compat consumption-mode leg. This is NOT a new
  # Rozie compile target — it builds the EXACT SAME React emit (Rozie target
  # 'react') with react/react-dom aliased to preact/compat (via the committed
  # sibling vite.config.preact.ts) and runs the SAME Playwright e2e suite over
  # it (VITE_USE_PREACT=1). Purpose: prove (and keep proving) that Rozie's React
  # output + @rozie/runtime-react run correctly under preact/compat — the mode
  # Preact users actually consume Rozie components through. Kept as a separate
  # sibling job (not a matrix include) because it needs none of the
  # react-version-override steps.
  preact-compat:
    runs-on: ubuntu-latest
    needs: build
    # 260825-hp3: `needs: build` is for ORDERING only. `!cancelled()` keeps
    # this job running even when the producer is red, so it falls back to a
    # real full build instead of being skipped and masking a failure.
    if: ${{ !cancelled() }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Restore-only (quick 260825-hp3). The `build` job above already produced
      # this exact key for this SHA, so `turbo run build` below replays from
      # cache instead of rebuilding the workspace. This job deliberately does
      # NOT save: every cell writing one key is what produced the observed
      # `Unable to reserve cache ... another job may be creating this cache`.
      # If the restore misses (producer red, cache evicted), the build step
      # below still does a real full build — degraded, never wrong.
      - name: Restore turbo cache (produced by the `build` job)
        uses: actions/cache/restore@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-react-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-react-
            ${{ runner.os }}-turbo-

      # Phase 22 / REQ-6: `turbo run build` includes react-vite-demo#build
      # (vite build), whose @rozie/unplugin buildStart hook emits the per-module
      # <Name>.d.rozie.ts sidecars BEFORE the typecheck step below.
      - name: Build all packages (generates .d.rozie.ts sidecars before typecheck — REQ-6)
        run: pnpm turbo run build

      # WR-03: a .rozie with no fresh sidecar after the build means buildStart
      # silently failed to emit it — a hard CI failure with --require-complete.
      - name: Verify every demo .rozie has a fresh sidecar (WR-03)
        run: node scripts/check-sidecar-staleness.mjs --require-complete

      # REQ-6: sidecars consumed here were generated by the build step above.
      - name: Typecheck demo (sidecars generated above — REQ-6)
        run: pnpm --filter react-vite-demo run typecheck

      # Build the demo with react/react-dom aliased to preact/compat.
      - name: Build demo (preact/compat)
        run: pnpm --filter react-vite-demo run build:preact

      - name: Install Playwright Chromium
        run: pnpm --filter react-vite-demo run test:e2e:install

      # VITE_USE_PREACT=1 routes playwright.config.ts webServer to build:preact.
      - name: Run Playwright e2e tests (preact/compat)
        run: pnpm --filter react-vite-demo run test:e2e:preact

      - name: Upload Playwright HTML report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-preact-compat
          path: examples/consumers/react-vite/playwright-report
          retention-days: 7
