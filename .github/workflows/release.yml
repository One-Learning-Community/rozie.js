name: Release (early subset)

# Manual, provenance-backed npm publish for the FIRST release wave ONLY:
#   - 9 @rozie/* toolchain packages (core, cli, unplugin, babel-plugin,
#     runtime-{react,vue,svelte,solid,lit}). 2026-08-02: runtime-{react,solid,
#     lit,svelte} ship 0.2.2 in this wave (array-form `:style` merge, `cbe01eaa`
#     — closes the published-vs-source drift where 0.2.1 predated that commit);
#     runtime-vue + runtime-keynav-core stay 0.2.1 (content-unchanged vs the
#     published tarball, so `pnpm publish` skips them as already-published).
#   - 7 @rozie-ui Vue leaves: flatpickr / sortable-list / cropper /
#     fullcalendar / pdf / captcha / tiptap (the `-vue` packages). captcha-vue was
#     added to dogfood it; like the others it is self-contained (zero @rozie/* deps,
#     dist externalizes only vue), so it publishes standalone. tiptap-vue was added
#     to dogfood it (2026-07-18, first-time @ 0.1.0) — also self-contained (dist
#     externalizes only vue + the @tiptap/* peers), so it publishes standalone.
#   - 5 non-vue @rozie-ui tiptap leaves: tiptap-{react,solid,lit,svelte,angular}.
#     Now IN scope alongside tiptap-vue — all six aligned at 0.2.0 (the FIRST
#     all-targets tiptap release line; 0.2.0 ships char-count + bubble-menu link
#     editor + themeable CSS-custom-property styling, all additive/minor). react/solid/
#     lit carry @rozie/runtime-<fw> and svelte carries @rozie/runtime-svelte (rewritten
#     from `workspace:` at publish; live on npm at 0.2.1); angular carries no @rozie dep
#     (tslib only). All six take the @tiptap/* v3 peers. Self-contained — no @rozie-ui
#     workspace peer, so no ordering coupling to any other leaf family.
#   - 5 non-vue @rozie-ui captcha leaves: captcha-{react,solid,lit,svelte,angular}.
#     These are now IN scope: they depend on @rozie/runtime-* (react/solid/lit/svelte),
#     and that prerequisite is satisfied — @rozie/runtime-* is live on npm at 0.1.1,
#     which pnpm rewrites the leaves' `workspace:` deps to at publish. angular carries
#     no @rozie dep (tslib only). This is the FIRST all-targets captcha release line
#     (all 6 leaves aligned at 0.1.3).
#   - 5 non-vue @rozie-ui sortable-list leaves: sortable-list-{react,solid,lit,svelte,angular}.
#     Now IN scope alongside sortable-list-vue (all 6 aligned at 0.1.5) — the svelte +
#     angular leaves were upgraded to the compiled dist+source standard, so all 6 ship
#     proper drop-in packages. react/solid/lit/svelte carry @rozie/runtime-* (rewritten
#     from `workspace:` at publish; live on npm at 0.1.1); angular carries no @rozie dep.
#   - 5 non-vue @rozie-ui pdf leaves: pdf-{react,solid,lit,svelte,angular}.
#     Now IN scope alongside pdf-vue (all 6 aligned at 0.2.1) — the FIRST all-targets
#     pdf release line (pdf-vue was previously the only published pdf leaf). react/solid/lit
#     carry @rozie/runtime-<fw> and svelte carries @rozie/runtime-svelte (rewritten from
#     `workspace:` at publish; live on npm at 0.1.3); angular carries no @rozie dep. All
#     six take pdfjs-dist as a peer dep. 0.2.1 also ships a render-all-pages scroll-spy fix.
#   - 5 non-vue @rozie-ui cropper leaves: cropper-{react,solid,lit,svelte,angular}.
#     Now IN scope alongside cropper-vue (all six aligned at 0.1.2 — the FIRST all-targets
#     cropper release line). These were excluded until now purely for lack of signal:
#     cropper-vue was the only leaf dogfooded in production, and the other five had no
#     verification. A whole-repo build/typecheck/codegen-idempotency/family-test/VR sweep
#     (2026-08-02) came back clean on all five, so they graduate as-is. react/solid/lit
#     carry @rozie/runtime-<fw> and svelte carries @rozie/runtime-svelte (rewritten from
#     `workspace:` at publish; live on npm at 0.2.1); angular carries no @rozie dep (tslib
#     only). All six take cropperjs v1 as a peer dep. Self-contained — no @rozie-ui
#     workspace peer, so no ordering coupling to popover / combobox / data-table.
#   - 5 non-vue @rozie-ui fullcalendar leaves: fullcalendar-{react,solid,lit,svelte,angular}.
#     Now IN scope alongside fullcalendar-vue (all six aligned at 0.1.2 — the FIRST
#     all-targets fullcalendar release line). Same story as cropper above: excluded purely
#     for lack of signal (fullcalendar-vue only was dogfooded), and the same 2026-08-02
#     verification sweep came back clean on all five. react/solid/lit carry
#     @rozie/runtime-<fw> and svelte carries @rozie/runtime-svelte (rewritten from
#     `workspace:` at publish; live on npm at 0.2.1); angular carries no @rozie dep (tslib
#     only). All six take @fullcalendar/* v6 as peer deps. Self-contained — no @rozie-ui
#     workspace peer, so no ordering coupling to popover / combobox / data-table.
#   - 6 @rozie-ui popover leaves: popover-{react,vue,solid,lit,svelte,angular}
#     (all six aligned at 0.1.0 — the FIRST all-targets popover release line). react/solid/
#     lit/vue carry @rozie/runtime-<fw> and svelte carries @rozie/runtime-svelte (rewritten
#     from `workspace:` at publish; live on npm); angular carries no @rozie dep (tslib only).
#     All six take @floating-ui/dom as a peer (plus their framework peer). This family is a
#     hard PREREQUISITE of the data-table Option-A release below and is published first.
#     Release-verified 2026-07-13: local `--gate` PASS (6/6 clean), all six build green.
#   - 6 @rozie-ui data-table leaves: data-table-{react,vue,solid,lit,svelte,angular}
#     (all six bumped 0.1.1 -> 0.2.0 — the Option-A popover-peer release line).
#     react/solid/lit/vue carry @rozie/runtime-<fw> (workspace:* -> exact) and svelte carries
#     @rozie/runtime-svelte (workspace:^) — all live on npm, rewritten from `workspace:` at
#     publish. solid also carries @solid-primitives/keyed; angular carries no @rozie dep
#     (tslib only). Under Option A the header `⋯` menu resolves the PUBLISHED
#     @rozie-ui/popover-<target> package at compile (schema-versioned manifest) instead of
#     vendoring its source, so each leaf now declares @rozie-ui/popover-<target> (^0.1.0) as a
#     required runtime peerDependency — hence popover MUST publish first (above), and popover
#     MUST build before data-table. headless-core stays dissolved at compile. All six take
#     @tanstack/table-core + @tanstack/virtual-core as peers (@floating-ui/dom graduated to
#     popover's peer). Release-verified 2026-07-13: local `--gate` PASS (6/6 clean).
#   - 6 @rozie-ui combobox leaves: combobox-{react,vue,solid,lit,svelte,angular}
#     (all six aligned at 0.1.0 — the FIRST all-targets combobox release line). react/solid/
#     lit/vue carry @rozie/runtime-<fw> and svelte carries @rozie/runtime-svelte (rewritten from
#     `workspace:` at publish; live on npm); angular carries no @rozie dep (tslib only).
#     Self-contained — no @rozie-ui workspace dep (vendors the listbox spine at authoring time).
#     Hard PREREQUISITE of the command-palette debut below; published first, built first.
#   - 6 @rozie-ui command-palette leaves: command-palette-{react,vue,solid,lit,svelte,angular}
#     (all six aligned at 0.1.0 — the DEBUT all-targets command-palette release line). The
#     earlier `major`/breaking `command-palette-listbox-slots` changeset was DROPPED: the family
#     was never published, so the slot re-align breaks no consumer and a 1.0.0 debut would be
#     wrong. Under Phase 999.4 Option B composition each leaf imports + declares
#     @rozie-ui/combobox-<target> (^0.1.0) as a required peer — hence combobox MUST publish first
#     (above) and build before command-palette. angular = tslib only; the rest carry
#     @rozie/runtime-<fw>. Release-verified 2026-07-13: local `--gate` PASS (12/12 with combobox).
#   - 6 @rozie-ui toast leaves: toast-{react,vue,solid,lit,svelte,angular}
#     (all six debuting at 0.1.0 — toast has never been published before). No @rozie-ui workspace
#     peer (self-contained, no composition dependency on any other leaf family) — react/solid/lit/
#     vue carry @rozie/runtime-<fw> and svelte carries @rozie/runtime-svelte (rewritten from
#     `workspace:` at publish; live on npm); angular carries tslib only, no @rozie dep. Same
#     build/publish profile as captcha: builds after the toolchain step (so local
#     @rozie/runtime-* dist exists for type resolution) with no ordering coupling to combobox or
#     any other leaf family.
#   - 6 @rozie-ui date-picker leaves: date-picker-{react,vue,solid,lit,svelte,angular}
#     (all six DEBUTING at 0.1.2 — the family has never been published; verified 0/6 via a direct
#     registry GET, since `npm view` lags on first-ever names). The 0.1.0/0.1.1/0.1.2 on-disk
#     spread is a changesets ripple artifact from @rozie/runtime-* bumps, not release history —
#     lockstep-aligned to 0.1.2 for the debut. NOTE (load-bearing): unlike the self-contained
#     -vue leaves in "Build Vue leaves" below, date-picker-vue DOES carry @rozie/runtime-vue, so
#     all six build together in their own step, placed AFTER the toolchain build so the local
#     @rozie/runtime-* dist exists for react/solid/lit/svelte/vue type resolution (angular =
#     tslib only) — same rationale as data-table / toast. Self-contained — no @rozie-ui workspace
#     peer, so no ordering coupling to popover / combobox / data-table / command-palette.
#     date-picker is a pure-Rozie family (no external engine peer) — framework peer only. 0.1.2
#     ships today's keyboard/a11y hardening: focusable-but-inert disabled cells per the ARIA grid
#     pattern, roving-tabindex fallback, drill focus continuity, and multi-month Home/End fixes.
#   - 6 @rozie-ui tags leaves: tags-{react,vue,solid,lit,svelte,angular}
#     (all six DEBUTING at 0.1.2 — the family has never been published; verified 0/6 via a direct
#     registry GET). The 0.1.0/0.1.1/0.1.2 on-disk spread is a changesets ripple artifact from
#     @rozie/runtime-* bumps, not release history — lockstep-aligned to 0.1.2 for the debut.
#     NOTE (load-bearing): unlike the self-contained -vue leaves in "Build Vue leaves" below,
#     tags-vue DOES carry @rozie/runtime-vue, so all six build together in their own step, placed
#     AFTER the toolchain build so the local @rozie/runtime-* dist exists for
#     react/solid/lit/svelte/vue type resolution (angular = tslib only) — same rationale as
#     data-table / toast. Self-contained — no @rozie-ui workspace peer, so no ordering coupling to
#     popover / combobox / data-table / command-palette. tags is a pure-Rozie family (no external
#     engine peer) — framework peer only.
#   - 6 @rozie-ui embla leaves: embla-{react,vue,solid,lit,svelte,angular}
#     (all six DEBUTING at 0.1.2 — verified 0/6 via a direct registry GET, since `npm view` lags on
#     first-ever names). The 0.1.0/0.1.1/0.1.2 on-disk spread is a changesets ripple artifact from
#     @rozie/runtime-* bumps, not release history — lockstep-aligned to 0.1.2 for the debut.
#     Self-contained — no @rozie-ui workspace peer, so no ordering coupling to popover / combobox /
#     data-table / command-palette. `embla-vue` is self-contained (zero @rozie/* deps), so it rides
#     the shared "Build/Publish Vue leaves" steps (the cropper/fullcalendar/pdf/tiptap shape) while
#     the other five get their own non-vue Build/Publish blocks. All six take
#     `embla-carousel ^8.6` + `embla-carousel-autoplay ^8.6` as PEERS; no engine CSS import is
#     required. react/solid/lit/svelte carry @rozie/runtime-<fw> — now 0.2.2 (bumped in this same
#     wave for the array-form `:style` merge), published by the "Publish toolchain" step earlier in
#     the same run; angular = tslib only.
#   - 6 @rozie-ui otp leaves: otp-{react,vue,solid,lit,svelte,angular}
#     (all six DEBUTING at 0.1.2 — verified 0/6 via a direct registry GET). The 0.1.0/0.1.1/0.1.2
#     on-disk spread is a changesets ripple artifact from @rozie/runtime-* bumps, not release
#     history — lockstep-aligned to 0.1.2 for the debut. Self-contained — no @rozie-ui workspace
#     peer, so no ordering coupling to popover / combobox / data-table / command-palette. `otp` is
#     pure-Rozie (no third-party engine): framework peer only, no external engine peer. NOTE
#     (load-bearing): unlike the self-contained -vue leaves in "Build Vue leaves" below, `otp-vue`
#     DOES carry @rozie/runtime-vue, so all six build together in their own step placed AFTER the
#     toolchain build — same rationale as data-table / toast / date-picker / tags. react/solid/lit/
#     svelte carry @rozie/runtime-<fw> — now 0.2.2 (bumped in this same wave); `otp-vue` carries
#     @rozie/runtime-vue@0.2.1 (unchanged — not part of this wave's runtime bump); angular = tslib
#     only.
#   - 6 @rozie-ui rete leaves: rete-{react,vue,solid,lit,svelte,angular}
#     (all six DEBUTING at 0.1.2 — verified 0/6 via a direct registry GET, since `npm view` lags on
#     first-ever names). The 0.1.0/0.1.1/0.1.2 on-disk spread is a changesets ripple artifact from
#     @rozie/runtime-* bumps, not release history — lockstep-aligned to 0.1.2 for the debut.
#     NOTE (load-bearing): unlike the self-contained -vue leaves in "Build Vue leaves" below,
#     `rete-vue` DOES carry @rozie/runtime-vue, so all six build together in their own step placed
#     AFTER the toolchain build so the local @rozie/runtime-* dist exists for
#     react/solid/lit/svelte/vue type resolution — same rationale as data-table / toast /
#     date-picker / tags / otp. Self-contained — no @rozie-ui workspace peer, so no ordering
#     coupling to popover / combobox / data-table / command-palette. Engine peers: `rete`,
#     `rete-area-plugin`, `rete-connection-plugin`, `rete-render-utils` (required) plus
#     `rete-auto-arrange-plugin`, `elkjs`, `web-worker` (optional), alongside the framework peer.
#     react/solid/lit carry @rozie/runtime-<fw> at `workspace:*`; svelte + vue carry `workspace:^`;
#     angular = tslib only. `rete-vue` ships a JetBrains `web-types.json` and `rete-lit` a Custom
#     Elements Manifest (`custom-elements.json`) — both in the tarball via `files`.
#     `rozie-manifest.json` is deliberately NOT shipped: rete is not a composition provider (no
#     other family imports @rozie-ui/rete-<target> at authoring time). Release-verified 2026-08-04
#     (quick 260803-qwh 4-agent pre-release audit + 260803-s3m + 260803-uwb + 260803-vcd;
#     series-end Docker VR).
#
# 2026-08-03 toolchain 0.3.0 + otp/embla 0.1.3 + emitter-ripple patch wave (quick 260803-1dl):
#   - @rozie/{core,cli,unplugin,babel-plugin} 0.2.1 -> 0.3.0 (minor — new `$memo` primitive +
#     ROZ146/ROZ147 diagnostics, ROZ144 retirement, ROZ207/ROZ208 narrowing, plus this series'
#     8 emitter seam fixes). @rozie/runtime-* deliberately NOT bumped (D1): the last runtime-
#     touching commit predates this whole series, so every runtime is content-identical to its
#     published tarball — confirmed via direct registry GET (all six 200). Bumping them would
#     manufacture 49 leaf-side timing false-fails for zero content delivered; leaving them put
#     means every one of the 49 bumped leaves' `@rozie/runtime-*` pin resolves to an
#     already-live version, so `--gate` check (e) is 100% clean on all 49 leaves — the exact
#     inverse of the toolchain-side same-run race (3 expected FAILs: cli/unplugin/babel-plugin
#     each briefly see `@rozie/core@0.3.0 NOT on npm` until the single "Publish toolchain" step's
#     topological order lands core first).
#   - `otp` + `embla`: all six leaves each, 0.1.2 -> 0.1.3 (both genuinely changed on all six —
#     not lockstep, just coincidentally uniform).
#   - 37 further leaves across 14 already-published families (captcha, combobox,
#     command-palette, cropper, data-table, date-picker, flatpickr, fullcalendar, pdf, popover,
#     sortable-list, tags, tiptap, toast) patch-bump ONLY the leaves whose emitted content
#     actually moved (D2 — per-leaf, not per-family lockstep). This corpus is already ragged
#     (e.g. captcha sits at react 0.1.6 / solid 0.1.6 / vue 0.1.3 / svelte 0.1.4 / lit 0.1.5 /
#     angular 0.1.3 after this wave) — "all six aligned" is a debut-release convention, not a
#     patch-wave one. An unchanged leaf enumerated in this file's `--filter` lists is simply
#     skipped by `pnpm publish` as already-published; no filter-list edit is needed for that case.
#   - Scope stays exactly the 16 families + 4 toolchain packages already wired above (D3) — the
#     13 additional unpublished families whose content also moved in this same seam batch
#     (chartjs, codemirror, dialog, lexical, listbox, maplibre, number-field, pagination,
#     resizable, rete, slider, switch, wavesurfer) are NOT added; their regenerated content ships
#     whenever they eventually debut.
#     (SUPERSEDED for rete only, 2026-08-04: rete is now release-verified and wired above; the
#     other 12 families remain out of scope.)
#
# 2026-08-04 react-staleness + component-prop-delivery patch wave (quick 260804-hzx):
#   - NO new family, NO --filter-list edit needed. All 21 bumped packages were already
#     enumerated in the Build, Publish and advisory-precheck lists (verified
#     programmatically: ALL WIRED 21/21). Unbumped siblings enumerated in those same
#     lists are simply skipped by `pnpm publish` as already-published (D-05, per-leaf
#     bumps rather than per-family lockstep).
#   - @rozie/{core,cli,unplugin,babel-plugin} 0.3.1 -> 0.3.2. `@rozie/core` DOES bump,
#     contra a toolchain-only assumption: commit `15a97bf3` — subject line says
#     "feat(runtime)" — also edited packages/core/src/rewrite/reservedNames.ts, and core
#     additionally inlines the private @rozie/target-* emitters, so all nine
#     target-react/target-solid seam commits are inside core's published dist. Derive the
#     toolchain set from `git log <cut>..HEAD -- packages/core -- packages/targets`,
#     never from a commit SUBJECT.
#   - @rozie/runtime-{react,solid} 0.2.2 -> 0.2.3 (additive `normalizeComponentAttrs`,
#     shipped as a PATCH per repo precedent). runtime-{lit,svelte} stay 0.2.2 and
#     runtime-{vue,keynav-core} stay 0.2.1 — all four verified byte-identical to their
#     published tarballs, so bumping them would publish unchanged content.
#   - 15 @rozie-ui `-react` leaves patch-bump (captcha, combobox, command-palette,
#     cropper, data-table, date-picker, embla, flatpickr, fullcalendar, otp, pdf,
#     popover, rete, sortable-list, tiptap). ZERO `-solid` leaves: the solid emitter
#     commits moved no leaf bytes (the corpus has no non-$attrs `r-bind` on a component
#     tag, and no leaf reads normalizeAttrs).
#   - Bump set derived MECHANICALLY by a per-leaf published-tarball comparison, not a
#     single commit-range cut — 35 of 102 wired leaves drifted, 67 clean. See
#     RELEASING.md §6 item 10 for the method and its two mandatory pack-time
#     normalizations.
#   - KNOWN DEBT surfaced by that method and deliberately NOT folded into this wave:
#     20 non-react leaves are currently STALE on npm (published tarball != committed
#     source at the same version). Documented in RELEASING.md §7 and backlogged as
#     `@rozie-ui stale-publish reconciliation`. Not caused by this series — every one of
#     its ten commits touches zero non-react leaf files.
#
# 2026-08-04 @rozie-ui stale-publish reconciliation wave (quick 260804-lxk):
#   - NO new family, NO --filter-list edit needed. All 19 bumped leaves were already
#     enumerated 3x in the Build, Publish, and advisory-precheck lists (verified
#     programmatically). Unbumped siblings enumerated in those same lists are simply
#     skipped by `pnpm publish` as already-published (D-02, per-leaf bumps).
#   - NO toolchain and NO runtime bump (D-03) — the drifted leaf content is already
#     produced by the published toolchain 0.3.2 / runtimes 0.2.3 that landed in the
#     260804-hzx wave; `git log 2568956e..HEAD -- packages/core packages/targets
#     packages/runtime` is empty.
#   - 19 of the 20 pre-existing stale-published non-react leaves (flagged by the
#     260804-hzx wave's derivation) are reconciled here: captcha-{angular,vue},
#     combobox-{svelte,vue}, command-palette-{angular,svelte,vue},
#     data-table-{angular,svelte,vue}, flatpickr-{angular,vue}, pdf-{angular,vue},
#     sortable-list-vue, tiptap-vue, toast-{angular,svelte,vue}. Each republishes the
#     ALREADY-committed generated output at a patch bump — no `.rozie` source, emitter,
#     runtime, or emitted leaf `src/` byte is touched by this wave.
#   - `@rozie-ui/popover-lit` is DELIBERATELY EXCLUDED (D-01) and stays stale on npm at
#     0.1.2 — its drift is a consumer-visible public-type change (unknown -> any on the
#     `anchor` render-prop slot scope), an API decision pending, not a mechanical patch
#     ripple. It is allowlisted (name@version-keyed, self-disarming on bump) in the new
#     release-precheck check (f) — published-tarball drift (RELEASING.md §6 item 11) —
#     so the class this wave exists to close cannot silently re-accumulate.
#
# Everything else is DELIBERATELY out of scope: any @rozie-ui family not enumerated
# above (maplibre, codemirror, lexical, chartjs, uppy, dialog, slider,
# …) is not release-verified. Do NOT widen the --filter lists below to other
# families without updating the release runbook.
#
# Prerequisites:
#   - Repo is PUBLIC (npm provenance requires a public source repo) — verified.
#   - Secret NPM_TOKEN = an npm automation/granular token with publish rights to
#     BOTH the @rozie and @rozie-ui scopes.
#   - `id-token: write` (below) lets npm mint the provenance attestation via
#     GitHub OIDC; without it, --provenance fails.
#
# SAFETY: dry_run defaults to TRUE. The first runs pack + validate but do NOT
# publish. To actually publish, dispatch with dry_run = false.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (pack + validate only; do NOT publish)'
        type: boolean
        default: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # required for npm provenance (OIDC)

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build ONLY the 9 toolchain packages. We list them explicitly rather than
      # --filter='@rozie/*' because that glob also matches @rozie/docs and would
      # drag in the heavy (OOM-prone) VitePress build. The 5 Vue leaves are built
      # separately (the "Build Vue leaves" step below) into a compiled dist/
      # drop-in (Vite lib mode + vue-tsc declaration emit) — they no longer ship
      # raw .vue source only.
      - name: Build toolchain
        run: >
          pnpm turbo run build --force
          --filter=@rozie/core
          --filter=@rozie/cli
          --filter=@rozie/unplugin
          --filter=@rozie/babel-plugin
          --filter=@rozie/runtime-keynav-core
          --filter=@rozie/runtime-react
          --filter=@rozie/runtime-vue
          --filter=@rozie/runtime-svelte
          --filter=@rozie/runtime-solid
          --filter=@rozie/runtime-lit

      # Append the registry auth line to the existing project .npmrc. The token
      # placeholder is left LITERAL here and expanded by pnpm at publish time
      # from the NODE_AUTH_TOKEN env on the publish steps below.
      - name: Configure npm auth
        run: |
          {
            echo "registry=https://registry.npmjs.org/"
            echo '//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}'
          } >> .npmrc

      - name: Resolve publish flags
        id: flags
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "extra=--dry-run" >> "$GITHUB_OUTPUT"
            echo "::notice::DRY RUN — packing and validating only, nothing will be published."
          else
            echo "extra=" >> "$GITHUB_OUTPUT"
            echo "::warning::LIVE PUBLISH — packages will be pushed to npm."
          fi

      # Toolchain first. pnpm rewrites workspace:* to the concrete 0.1.0 version
      # in the tarball; npm publish does NOT, so this MUST go through pnpm.
      - name: Publish toolchain (@rozie/*)
        run: >
          pnpm
          --filter=@rozie/core
          --filter=@rozie/cli
          --filter=@rozie/unplugin
          --filter=@rozie/babel-plugin
          --filter=@rozie/runtime-keynav-core
          --filter=@rozie/runtime-react
          --filter=@rozie/runtime-vue
          --filter=@rozie/runtime-svelte
          --filter=@rozie/runtime-solid
          --filter=@rozie/runtime-lit
          publish --access public --no-git-checks --provenance ${{ steps.flags.outputs.extra }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'

      # Build the 8 Vue leaves into their compiled dist/ drop-in (Vite lib mode +
