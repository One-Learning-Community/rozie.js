<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <!-- Marketplace tile for the Rozie VS Code extension. Deliberately the SAME
       mark as the IntelliJ plugin's META-INF/pluginIcon.svg (rounded square,
       #3b82f6, white bold R) so both IDE surfaces read as one product.
       Scaled from that 40x40 original: rx 6/40, font-size 24/40, baseline 28/40.
       icon.png is rasterised from this file. Regenerate with:
       rsvg-convert -w 256 -h 256 media/icon.svg -o media/icon.png -->
  <rect width="256" height="256" rx="38.4" fill="#3b82f6"/>
  <text x="128" y="179.2" font-family="Helvetica,Arial,sans-serif" font-size="153.6"
        font-weight="bold" fill="#ffffff" text-anchor="middle">R</text>
</svg>
